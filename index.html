<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'/>
<meta content='width=device-width, initial-scale=1, user-scalable=1, minimum-scale=1, maximum-scale=5' name='viewport'/>
<meta content='IE=edge' http-equiv='X-UA-Compatible'/>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Caveat&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
  <script src="https://unpkg.com/typeit@8.7.0/dist/index.umd.js"></script>
  <script src="https://kit.fontawesome.com/4f3ce16e3e.js" crossorigin="anonymous"></script>
  
<title>Untuk Ayaaa Sayanggg</title>
<style>
:root {
  --warna-bg: rgba(0, 0, 0, .3); 
  --tombol-teks: #fff;
  --gaya-font: 'Nunito Sans', sans-serif;
  --gaya-font2: 'Caveat', cursive;
}

body {
  background-color: #000;
  font-family: var(--gaya-font);
  padding: 20px 25px;
  -webkit-user-select: none;
  user-select: none;
  overflow: hidden;
}

#bodyblur {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.3); transition: all 1s ease; z-index: -1;
}

#wallpaper {
  width: 100%; height: 100%; object-fit: cover;
  filter: brightness(0.5);
}

#Content {
  opacity: 0; margin-top: 100px;
  display: flex; flex-direction: column; align-items: center;
  transition: all .7s ease;
}

#ftAwal img {
  width: 130px; height: 130px; margin-bottom: 20px;
}

.lovein {
  background: #fff; border-radius: 50%; width: 50px; height: 50px;
  padding: 10px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; animation: pulse 1s infinite alternate;
}

@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

#pergeseran {
  display: none; width: 100%; max-width: 400px;
  margin-top: 20px;
}

#pergeseran p {
  background: rgba(0, 0, 0, .5); border-left: 2px solid #fff; border-right: 2px solid #fff;
  padding: 20px; color: white; text-align: center; border-radius: 15px;
  display: none; animation: rts .5s ease;
}

#pergeseran p b img { 
  width: 180px; height: 180px; 
  margin-bottom: 15px; 
  object-fit: cover; 
  border-radius: 15px; 
  border: 2px solid #fff;
}

#pergeseran p b img.stiker {
  width: 80px; height: 80px; border: none; border-radius: 0;
}

/* Gaya Angka Usia */
.angka-usia {
  font-family: var(--gaya-font2);
  font-size: 55px;
  color: #ffeb3b;
  text-shadow: 2px 2px 10px rgba(0,0,0,.5);
  display: block;
  margin-top: 10px;
}

#Tombol {
  margin-top: 20px; display: none; opacity: 0;
  transition: all .5s ease;
}

#Tombol a {
  cursor: pointer; padding: 12px 25px; background: rgba(255,255,255,0.2);
  color: white; border: 1px solid #fff; border-radius: 20px;
  backdrop-filter: blur(2px);
}

blockquote {
  display: none; text-align: center; color: white;
  padding: 20px; border-radius: 15px;
}

#teksnim { font-family: var(--gaya-font2); font-size: 26px; font-weight: 700; margin-bottom: 15px; }

.fa-heart {
  position: fixed; color: #ff0000; opacity: 0.5;
  animation: heartMove linear forwards; z-index: 100;
}

@keyframes heartMove {
  0% { transform: translateY(-10vh) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}

@keyframes rts { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
   
   <audio src="https://feeldreams.github.io/audio/anditsnot.mp3" id="linkmp3"></audio>
   
   <div id="bodyblur">
     <img src="https://feeldreams.github.io/pics/awan3.jpg" id="wallpaper"/>
   </div>
   
   <div id='Content'>

     <div id="ftAwal">
       <img src="https://feeldreams.github.io/pandaputih.gif" id="ftoAwal"/>
     </div>

     <div id="loveIn" onclick="mulai()">
       <div class='lovein'>
         <svg viewBox="0 0 24 24" width="30" height="30" fill="red"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
       </div>
     </div>
     <p id="ket" style="color: white; margin-top: 15px;">Sentuh LOVEnya!</p>

     <div id='pergeseran'>
        
        <p id="p1"><b>
          <img src="lutuu.jpg"/><br> <span>Hai Ayaaa sayanggg 🤭❤️</span>
        </b></p>

        <p id="p2"><b>
          <img src="WhatsApp Image 2025-12-30 at 17.02.14.jpg"/><br> <span>Selamat Ulang Tahun ya! ✨</span>
        </b></p>

        <p id="p3"><b>
          <img class="stiker" src="https://feeldreams.github.io/g5.gif"/><br>
          <span>Semoga di hari spesial ini... ✨</span>
        </b></p>

        <p id="p4"><b>
          <img class="stiker" src="https://feeldreams.github.io/mndkat.gif"/><br>
          <span>Ayaa selalu sehat dan<br>bahagia terusss 🥰</span>
        </b></p>

        <p id="p5"><b>
          <img class="stiker" src="https://feeldreams.github.io/cilukba.gif"/><br>
          <span>Tetap jadi Ayaa yang baik,<br>ceria, dan gemesin yaa! 😋❤️</span>
        </b></p>

        <p id="p6"><b>
          <img src="1.jpeg"/><br> <span>I'm so lucky to have you! 💐✨</span>
        </b></p>

        <p id="p7"><b>
          <img class="stiker" src="https://feeldreams.github.io/gumush.gif"/><br>
          <span>Yeay! Sekarang usiamu sudah:</span>
          <span class="angka-usia">19</span> </b></p>

     </div>

     <blockquote id='bq'>
       <p id="teksnim">Happy Level Up Day! 🥳</p>
       <p id="kalimat"></p>
     </blockquote>

     <div id="Tombol">
       <a onClick="multifungsi()" id="tmbl">Lanjut 👉</a>
     </div>
     
   </div>

<script>
const body = document.querySelector("body");
const swals = Swal.mixin({timer: 99999, allowOutsideClick: false, showConfirmButton: true, timerProgressBar: false, imageHeight: 90,}); 
const audio = document.getElementById("linkmp3");
let slideSaatIni = 1;
const totalSlide = 7; // Total slide sekarang ada 7

function berjatuhan() {
  const heart = document.createElement("div"); 
  heart.className = "fas fa-heart"; 
  heart.style.left = (Math.random() * 90) + "vw"; 
  heart.style.animationDuration = (Math.random() * 3) + 2 + "s"; 
  body.appendChild(heart);
  setTimeout(() => { heart.remove(); }, 5000);
}

function mulai() {
  audio.play();
  document.getElementById("loveIn").style.display = "none";
  document.getElementById("ftAwal").style.display = "none";
  document.getElementById("ket").style.display = "none";
  document.getElementById("Content").style.opacity = "1";
  document.getElementById("Content").style.marginTop = "7vh";
  
  document.getElementById("pergeseran").style.display = "block";
  tampilkanSlide(1);
}

function tampilkanSlide(n) {
  for (let i = 1; i <= totalSlide; i++) {
    document.getElementById("p" + i).style.display = "none";
  }
  document.getElementById("p" + n).style.display = "block";
  document.getElementById("Tombol").style.display = "flex";
  document.getElementById("Tombol").style.opacity = "1";
}

function multifungsi() {
  if (slideSaatIni < totalSlide) {
    slideSaatIni++;
    tampilkanSlide(slideSaatIni);
    if (slideSaatIni === totalSlide) {
      document.getElementById("tmbl").innerHTML = "13 April 2026 💌";
    }
  } else {
    aksibalas();
  }
}

async function aksibalas() {
  document.getElementById("pergeseran").style.display = "none";
  document.getElementById("Tombol").style.display = "none";
  
  const { isConfirmed: mau } = await swals.fire({
    title: 'Mau Kado Gak Nih? 🤭❤️',
    imageUrl: 'https://feeldreams.github.io/pandaputih.gif',
    showCancelButton: true,
    confirmButtonText: 'Mau!',
    cancelButtonText: 'Enggak',
  });

  if (mau) {
    await swals.fire({
      title: 'Tapi Boong! 🤣',
      text: 'Gajadi ngasih kado ah, soalnya kamu bau 😜❤️',
      imageUrl: 'https://feeldreams.github.io/weee.gif',
    });
  } else {
    await swals.fire({
      title: 'Yaudah!',
      text: 'Beneran gamau ya? Okedeh 😜❤️',
      imageUrl: 'https://feeldreams.github.io/ngumpet.gif',
    });
  }
  
  bqmuncul();
}

function bqmuncul() {
  document.getElementById("bq").style.display = "block";
  new TypeIt("#kalimat", {
    strings: ["Intinya semoga di hari bertambahnya usia Ayaa ini, Ayaa bisa menjadi pribadi yang lebih baik lagi yaa.. 🥳<br><br><b>Wish You All The Best ✨</b>"],
    startDelay: 500,
    speed: 50,
    cursor: true,
    afterComplete: function() {
      setInterval(berjatuhan, 300);
    }
  }).go();
}

window.onload = () => {
  document.getElementById("Content").style.opacity = "1";
};
</script>
</body>
</html>
